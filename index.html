<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcade Hub - Reaction Test & Dino Game</title>
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --red: #ef4444;
      --green: #22c55e;
      --blue: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    header p {
      color: var(--subtext);
      font-size: 1rem;
    }

    .nav-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      background-color: var(--card-bg);
      padding: 6px;
      border-radius: 12px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--subtext);
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background-color: var(--accent);
      color: var(--bg);
    }

    .game-container {
      width: 100%;
      max-width: 640px;
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .game-screen {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .game-screen.active {
      display: flex;
    }

    .scoreboard {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin-bottom: 16px;
      background: rgba(255, 255, 255, 0.05);
      padding: 12px;
      border-radius: 8px;
    }

    .score-item {
      text-align: center;
    }

    .score-item span {
      display: block;
      font-size: 0.8rem;
      color: var(--subtext);
    }

    .score-item strong {
      font-size: 1.2rem;
      color: var(--accent);
    }

    .reaction-box {
      width: 100%;
      height: 320px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      text-align: center;
      padding: 20px;
      transition: background-color 0.1s ease;
    }

    .reaction-box.start { background-color: var(--blue); }
    .reaction-box.wait { background-color: var(--red); }
    .reaction-box.ready { background-color: var(--green); }

    .reaction-box h2 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .reaction-box p {
      font-size: 1rem;
      opacity: 0.9;
    }

    canvas {
      background-color: #000;
      border-radius: 12px;
      width: 100%;
      max-width: 600px;
      height: 200px;
      display: block;
    }

    .controls-hint {
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--subtext);
    }

    .restart-btn {
      margin-top: 16px;
      padding: 10px 20px;
      font-size: 1rem;
      background-color: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .restart-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <header>
    <h1>PY Mini-Games</h1>
    <p>Created by S.Deepan</p>
  </header>

  <nav class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('reaction')">Reaction Test</button>
    <button class="tab-btn" onclick="switchTab('dino')">Dino Runner</button>
  </nav>

  <main class="game-container">
    <section id="reaction-screen" class="game-screen active">
      <div class="scoreboard">
        <div class="score-item">
          <span>Last Time</span>
          <strong id="last-time">-- ms</strong>
        </div>
        <div class="score-item">
          <span>Best Time</span>
          <strong id="best-time">-- ms</strong>
        </div>
      </div>

      <div id="reaction-box" class="reaction-box start" onclick="handleReactionClick()">
        <h2 id="reaction-title">Click to Start</h2>
        <p id="reaction-desc">When the red box turns green, click as fast as you can.</p>
      </div>
    </section>

    <section id="dino-screen" class="game-screen">
      <div class="scoreboard">
        <div class="score-item">
          <span>Score</span>
          <strong id="dino-score">0</strong>
        </div>
        <div class="score-item">
          <span>High Score</span>
          <strong id="dino-highscore">0</strong>
        </div>
      </div>

      <canvas id="dinoCanvas" width="600" height="200"></canvas>
      <p class="controls-hint">Press <strong>Spacebar</strong> or <strong>Tap Screen</strong> to jump</p>
      <button id="dino-restart" class="restart-btn" style="display:none;" onclick="resetDinoGame()">Play Again</button>
    </section>
  </main>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.game-screen').forEach(scr => scr.classList.remove('active'));

      if (tab === 'reaction') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('reaction-screen').classList.add('active');
        resetReactionTest();
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('dino-screen').classList.add('active');
        startDinoGame();
      }
    }

    const reactionBox = document.getElementById('reaction-box');
    const reactionTitle = document.getElementById('reaction-title');
    const reactionDesc = document.getElementById('reaction-desc');
    const lastTimeEl = document.getElementById('last-time');
    const bestTimeEl = document.getElementById('best-time');

    let state = 'start';
    let timerTimeout = null;
    let startTime = 0;
    let bestScore = localStorage.getItem('bestReaction') || null;

    if (bestScore) bestTimeEl.textContent = bestScore + ' ms';

    function resetReactionTest() {
      clearTimeout(timerTimeout);
      state = 'start';
      reactionBox.className = 'reaction-box start';
      reactionTitle.textContent = 'Click to Start';
      reactionDesc.textContent = 'When the red box turns green, click as fast as you can.';
    }

    function handleReactionClick() {
      if (state === 'start') {
        state = 'waiting';
        reactionBox.className = 'reaction-box wait';
        reactionTitle.textContent = 'Wait for green...';
        reactionDesc.textContent = '';

        const randomDelay = Math.floor(Math.random() * 3000) + 2000;
        timerTimeout = setTimeout(() => {
          state = 'ready';
          reactionBox.className = 'reaction-box ready';
          reactionTitle.textContent = 'CLICK!';
          startTime = Date.now();
        }, randomDelay);
      } else if (state === 'waiting') {
        clearTimeout(timerTimeout);
        state = 'start';
        reactionBox.className = 'reaction-box start';
        reactionTitle.textContent = 'Too Soon!';
        reactionDesc.textContent = 'You clicked before the box turned green. Click to try again.';
      } else if (state === 'ready') {
        const elapsedTime = Date.now() - startTime;
        state = 'start';
        reactionBox.className = 'reaction-box start';
        reactionTitle.textContent = `${elapsedTime} ms`;
        reactionDesc.textContent = 'Click to test again.';

        lastTimeEl.textContent = `${elapsedTime} ms`;

        if (!bestScore || elapsedTime < bestScore) {
          bestScore = elapsedTime;
          localStorage.setItem('bestReaction', bestScore);
          bestTimeEl.textContent = `${bestScore} ms`;
        }
      }
    }

    const canvas = document.getElementById('dinoCanvas');
    const ctx = canvas.getContext('2d');
    const dinoScoreEl = document.getElementById('dino-score');
    const dinoHighScoreEl = document.getElementById('dino-highscore');
    const dinoRestartBtn = document.getElementById('dino-restart');

    let isPlaying = false;
    let animationFrameId;
    let score = 0;
    let highScore = localStorage.getItem('dinoHighScore') || 0;

    dinoHighScoreEl.textContent = highScore;

    const dino = {
      x: 50,
      y: 150,
      width: 30,
      height: 40,
      dy: 0,
      gravity: 0.6,
      jumpForce: -11,
      grounded: true
    };

    let obstacles = [];
    let frameCount = 0;

    function startDinoGame() {
      if (isPlaying) return;
      resetDinoGame();
    }

    function resetDinoGame() {
      cancelAnimationFrame(animationFrameId);
      dino.y = 150;
      dino.dy = 0;
      dino.grounded = true;
      obstacles = [];
      score = 0;
      frameCount = 0;
      isPlaying = true;
      dinoScoreEl.textContent = '0';
      dinoRestartBtn.style.display = 'none';
      gameLoop();
    }

    function jump() {
      if (dino.grounded && isPlaying) {
        dino.dy = dino.jumpForce;
        dino.grounded = false;
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && document.getElementById('dino-screen').classList.contains('active')) {
        e.preventDefault();
        jump();
      }
    });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      jump();
    });

    canvas.addEventListener('mousedown', jump);

    function gameLoop() {
      if (!isPlaying) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 190);
      ctx.lineTo(canvas.width, 190);
      ctx.stroke();

      dino.dy += dino.gravity;
      dino.y += dino.dy;

      if (dino.y >= 150) {
        dino.y = 150;
        dino.dy = 0;
        dino.grounded = true;
      }

      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(dino.x, dino.y, dino.width, dino.height);

      frameCount++;

      if (frameCount % 90 === 0) {
        const height = Math.floor(Math.random() * 20) + 30;
        obstacles.push({
          x: canvas.width,
          y: 190 - height,
          width: 20,
          height
        });
      }

      for (let i = 0; i < obstacles.length; i++) {
        const obs = obstacles[i];
        obs.x -= 6;

        ctx.fillStyle = '#ef4444';
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

        if (
          dino.x < obs.x + obs.width &&
          dino.x + dino.width > obs.x &&
          dino.y < obs.y + obs.height &&
          dino.y + dino.height > obs.y
        ) {
          gameOver();
          return;
        }
      }

      obstacles = obstacles.filter(obs => obs.x + obs.width > 0);

      score++;
      dinoScoreEl.textContent = Math.floor(score / 5);

      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function gameOver() {
      isPlaying = false;
      const finalScore = Math.floor(score / 5);

      if (finalScore > highScore) {
        highScore = finalScore;
        localStorage.setItem('dinoHighScore', highScore);
        dinoHighScoreEl.textContent = highScore;
      }

      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);

      dinoRestartBtn.style.display = 'block';
    }
  </script>
</body>
</html>
